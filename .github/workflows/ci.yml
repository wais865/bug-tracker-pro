name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  unit-tests-backend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.tests-backend.outputs.report }}
    steps:
      - uses: actions/checkout@v7

      - name: set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: bugtracker-backend/go.sum

      - name: install junit reporter
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: execute backend unit tests
        id: tests-backend
        working-directory: ./bugtracker-backend
        run: |
          go test -json -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out > coverage.txt 

          echo "## Go Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat coverage.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          go test -v 2>&1 ./... | go-junit-report -set-exit-code > test-results.xml

      - name: publish backend test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: backend unit tests report
          path: bugtracker-backend/test-results.xml
          reporter: jest-junit
  
  
  unit-tests-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: bugtracker-frontend/package-lock.json
      
      - name: execute frontend unit tests
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test | tee full-output.txt

          echo "## Frontend Test Output" >> $GITHUB_STEP_SUMMARY
          cat full-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: publish frontend test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: frontend unit tests report
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit


  create-coverage-comment:
    if: github.event_name == 'pull_request'
    needs: [unit-tests-backend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create coverage comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Go Test Coverage Report
            ```
            ${{needs.unit-tests-backend.outputs.coverage}}
            ```

      